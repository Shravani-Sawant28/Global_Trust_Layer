[package]
name = "gtl-reputation-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.9"
alloy-primitives = "0.8"
alloy-sol-types = "0.8"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false